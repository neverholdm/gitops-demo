name: GitOps CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'agent.md'
      - 'GITOPS_IMPLEMENTATION_PLAN.md'
  workflow_dispatch: # 支持在 GitHub Web 界面手工一键触发测试

# 最小权限原则：仅授予代码只读权限与 GitHub Packages 容器镜像写入权限
permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 任务 3.1：代码质量门禁 (Quality Gate & Static Analysis)
  # ============================================================================
  quality-gate:
    name: Code Quality Gate (Lint & Syntax)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tool (Ruff)
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        # 极速扫描代码语法错误、未引用变量及 PEP8 规范
        run: |
          ruff check app/

  # ============================================================================
  # 任务 3.2：容器镜像构建与多标签推送至 ghcr.io
  # ============================================================================
  build-and-push:
    name: Build & Push Container Image
    needs: quality-gate # 门禁不通过则流水线立即熔断，不执行打包
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 自动转换为全小写格式，避免 GitHub 用户名大写导致 Docker 镜像标签非法
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 启用 GitHub Actions 缓存加速层，依赖不变时秒级完成构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 任务 3.4：零信任加密 Webhook 通知下发 (Trigger CD Receiver)
  # ============================================================================
  notify-cd-receiver:
    name: Trigger Remote CD Deployment Webhook
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Calculate HMAC-SHA256 Signature & Dispatch Webhook
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import time
          import hmac
          import hashlib
          import json
          import urllib.request
          import urllib.error

          server_ip = os.environ.get("SERVER_IP", "").strip()
          server_port = os.environ.get("SERVER_PORT", "9000").strip()
          secret = os.environ.get("WEBHOOK_SECRET", "").strip()

          if not server_ip or not secret:
              print("::error::[Configuration Error] SERVER_IP or WEBHOOK_SECRET is not configured in GitHub Secrets!")
              sys.exit(1)

          # 1. 获取当前 UTC Unix 秒级时间戳（防重放攻击基准）
          timestamp = str(int(time.time()))

          # 2. 组装标准触发报文
          payload = {
              "event": "push",
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "commit": os.environ.get("GITHUB_SHA", ""),
              "image_tag": "latest"
          }
          body = json.dumps(payload, separators=(',', ':'))

          # 3. 计算零信任 HMAC-SHA256 签名: HMAC(Secret, Timestamp + Body)
          message = (timestamp + body).encode("utf-8")
          signature = hmac.new(secret.encode("utf-8"), message, hashlib.sha256).hexdigest()

          url = f"http://{server_ip}:{server_port}/webhook"
          req = urllib.request.Request(
              url,
              data=body.encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "X-Timestamp": timestamp,
                  "X-Signature-256": signature,
                  "User-Agent": "GitHub-Actions-GitOps-CI"
              },
              method="POST"
          )

          print(f"Connecting to CD receiver at: http://{server_ip}:{server_port}/webhook")
          print(f"Timestamp: {timestamp} | Commit SHA: {payload['commit'][:8]}")

          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  status_code = resp.getcode()
                  resp_text = resp.read().decode("utf-8")
                  print(f"Response status: {status_code}")
                  print(f"Response content: {resp_text}")
                  if status_code in (200, 202):
                      print("::notice::CD Webhook delivered successfully! (Deployment task accepted)")
                  else:
                      print(f"::warning::Unexpected response HTTP {status_code}")
          except urllib.error.HTTPError as e:
              err_text = e.read().decode('utf-8', errors='ignore')
              print(f"::error::Server rejected Webhook: HTTP {e.code} - {err_text}")
              sys.exit(1)
          except Exception as e:
              print(f"::error::Failed to reach server: {e}")
              print("::warning::Please verify server security group port 9000 and CD daemon status.")
              sys.exit(1)
          EOF
